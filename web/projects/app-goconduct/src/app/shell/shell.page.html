<app-top-navigation />

<div class="shell__body">
  <aside class="shell__sidebar" [class.shell__sidebar--dense]="shell.dense()">
    <nav class="shell__navigation" aria-label="Sections">
      @for (group of navigationGroups; track group.id) {
        <section class="shell__group">
          @if (!shell.dense() && navigationGroups.length > 1) {
            <p class="shell__group-title">{{ group.title }}</p>
          }

          @for (item of group.children; track item.id) {
            <a
              class="shell__item"
              ariaCurrentWhenActive="page"
              routerLinkActive="shell__item--active"
              [routerLink]="item.link"
              [attr.title]="shell.dense() ? item.title : null"
            >
              <tui-icon [icon]="item.icon" />
              @if (!shell.dense()) {
                <span>{{ item.title }}</span>
              }
            </a>
          }
        </section>
      }
    </nav>

    <div class="shell__sidebar-footer">
      @if (shell.dense()) {
        <button
          appearance="flat-grayscale"
          iconStart="@tui.panel-left-open"
          size="s"
          tuiIconButton
          type="button"
          aria-label="Expand the sidebar"
          (click)="shell.toggleDensity()"
        ></button>
      } @else {
        <button
          appearance="flat-grayscale"
          iconStart="@tui.panel-left-close"
          size="s"
          tuiButton
          type="button"
          (click)="shell.toggleDensity()"
        >
          Collapse
        </button>
      }
    </div>
  </aside>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
